<template id="tpl-welcome">

      <h1 class="display">Big Dream Guide 3: <span class="italic">Clarify the Big Dream</span></h1>
      <p class="lede">You have named the Big Dread. You have sketched possible futures. Now you choose a direction clearly enough that it can begin to guide your life.</p>

      <div class="callout">
        <h3 class="callout-title">A DIRECTION, NOT A FANTASY</h3>
        <p>A Big Dream is not a fantasy.</p>
        <p>It is a direction your life can move towards.</p>
        <p>This guide helps you describe that direction in a way you can carry with you, return to and act on.</p>
        <p>You will write it three times: first as a draft, then as a clean paragraph, then as <em>a single sentence you can remember.</em></p>
      </div>

      <div class="field-group">
        <label class="field-label" for="participant_name">Participant name <span class="req">*</span></label>

      </div>

      <div class="actions">
        <button class="btn-primary" data-action="next">Begin <span class="arrow">→</span></button>
      </div>
      <p class="tiny-note">Your answers are saved on your device as you go. You can leave and come back.</p>
    </div>

<template id="tpl-examples">
  <section class="screen">
    <div class="container narrow">
      <h2 class="section-title">Let's clarify your Big Dream...</h2>

      <figure class="figure">
        <img src="../images/g3/characters.jpg" alt="" />
      </figure>

      <h3 class="sub-title">Optional Example Characters</h3>
      <p class="muted">Pieter and Marietjie are fictional example participants. Their examples are included only to help you if you feel stuck. Use them as a guide, then return to your own life and write what is true for you.</p>

      <div class="character-block">
        <h4>Pieter van der Merwe</h4>
        <p>From Guide 2, Pieter chose to develop the future of becoming a healthier business owner who leads through people and systems instead of constant personal rescue.</p>
      </div>
      <div class="character-block">
        <h4>Marietjie Botha</h4>
        <p>From Guide 2, Marietjie chose to develop the future of becoming a woman who teaches, writes and facilitates from her own voice while still loving and caring for her family.</p>
      </div>

      <figure class="figure">
        <img src="../images/g3/method.jpg" alt="" />
      </figure>

      <h3 class="sub-title">The Method Behind This Guide</h3>
      <p>This guide uses four practical methods:</p>
      <ol class="method-list">
        <li>
          <strong>Best Possible Self writing</strong>
          <p>You describe a future version of your life in concrete, observable detail.</p>
        </li>
        <li>
          <strong>Self-Determination Theory</strong>
          <p>You check that your direction is genuinely your own, not borrowed or performed for approval.</p>
        </li>
        <li>
          <strong>Values clarification</strong>
          <p>You name the parts of yourself that come alive when you move in this direction.</p>
        </li>
        <li>
          <strong>Identity-based reflection</strong>
          <p>You describe the kind of person you are becoming as you live this dream.</p>
        </li>
      </ol>
      <p class="instruction">A Big Dream is not just a result.<br/>It is a direction, a way of being and <em>a private promise to yourself.</em></p>

      <div class="actions split">
        <button class="btn-secondary" data-action="prev"><span class="arrow">←</span> Back</button>
        <button class="btn-primary" data-action="next">Continue <span class="arrow">→</span></button>
      </div>
    </div>
  </section>
</template>

<template id="tpl-domains">

        <img src="../images/g3/domains.jpg" alt="" />
      </figure>

          <input type="checkbox" id="domains_other_box" data-key="domains_other_box" />
          <span>Other:</span>
          <input type="text" id="domains_other_text" class="text-input inline-text" data-key="domains_other_text" placeholder="Type your own…" />
        </label>
        <p class="tiny-note left" id="domainsCounter">0 of 3 selected</p>
      </fieldset>

      <div class="field-group">
        <label class="field-label" for="domain1_text">In domain one, my Big Dream shows up as:</label>
        <textarea id="domain1_text" class="textarea" data-key="domain1_text" data-photo rows="3" placeholder="What does the dream look like in this part of life?"></textarea>
      </div>
      <div class="field-group">
        <label class="field-label" for="domain2_text">In domain two, my Big Dream shows up as:</label>
        <textarea id="domain2_text" class="textarea" data-key="domain2_text" data-photo rows="3"></textarea>
      </div>
      <div class="field-group">
        <label class="field-label" for="domain3_text">In domain three, my Big Dream shows up as:</label>
        <textarea id="domain3_text" class="textarea" data-key="domain3_text" data-photo rows="3"></textarea>
      </div>

      <details class="examples">
        <summary>Show examples</summary>
        <div class="example">
          <strong>Pieter's example</strong>
          <p><em>Work / business / calling:</em> leading the business through people and systems instead of personal rescue.</p>
          <p><em>Health and energy:</em> rebuilding strength, sleep and stamina so I am not running on adrenaline.</p>
          <p><em>Closest relationships:</em> being emotionally present, available and patient with my wife and children.</p>
        </div>
        <div class="example">
          <strong>Marietjie's example</strong>
          <p><em>Work / business / calling:</em> teaching, writing and facilitating from my own voice.</p>
          <p><em>Inner life:</em> rebuilding a sense of selfhood that is not built on performing for others.</p>
          <p><em>Closest relationships:</em> being a present mother who is also a whole person, not just a role.</p>
        </div>
      </details>

      <div class="actions split">
        <button class="btn-secondary" data-action="prev"><span class="arrow">←</span> Back</button>

<template id="tpl-observable">

      <div class="step-eyebrow">Step 3</div>
      <h2 class="section-title">Make the Dream Observable</h2>
      <p class="instruction">A vague dream cannot guide you.<br/>An observable dream can. Describe what your life <em>actually looks like</em> when you are living this Big Dream.</p>

      <figure class="figure">
        <img src="../images/g3/observable.jpg" alt="" />
      </figure>

      <div class="field-group">
        <label class="field-label" for="normal_week">A normal week in this Big Dream looks like:</label>
        <textarea id="normal_week" class="textarea long" data-key="normal_week" data-photo rows="6" placeholder="Mornings, evenings, rhythms, people, work, rest…"></textarea>
      </div>
      <div class="field-group">
        <label class="field-label" for="stop_tolerating">In this dream I have stopped tolerating:</label>
        <textarea id="stop_tolerating" class="textarea" data-key="stop_tolerating" data-photo rows="4"></textarea>
      </div>
      <div class="field-group">
        <label class="field-label" for="take_care">In this dream I take care of:</label>
        <textarea id="take_care" class="textarea" data-key="take_care" data-photo rows="4" placeholder="My body, my work, my closest people, my inner life…"></textarea>
      </div>

      <details class="examples">
        <summary>Show examples</summary>
        <div class="example">
          <strong>Pieter's example</strong>
          <p><em>A normal week:</em> mornings start calmly, I move my body, I meet with my team weekly instead of rescuing every problem, evenings are with my family, weekends are protected.</p>
          <p><em>I have stopped tolerating:</em> constant availability, rescuing every problem, scattered attention, my body being treated like a rented machine.</p>
          <p><em>I take care of:</em> my body, my team, my family, my own thinking time.</p>
        </div>
        <div class="example">
          <strong>Marietjie's example</strong>
          <p><em>A normal week:</em> I teach with focus, I write two mornings a week, I rest properly on Sundays, I have one honest conversation with my husband each week.</p>
          <p><em>I have stopped tolerating:</em> being last on my own list, performing for approval, resentment as my baseline.</p>
          <p><em>I take care of:</em> my voice, my creative practice, my marriage, my friendships, my own rest.</p>
        </div>
      </details>

      <div class="actions split">
        <button class="btn-secondary" data-action="prev"><span class="arrow">←</span> Back</button>
        <button class="btn-primary" data-action="next">Continue <span class="arrow">→</span></button>
      </div>
    </div>
  </section>
</template>

      <h2 class="section-title">Alignment Test</h2>
      <p class="instruction">Score each statement from 1 (not at all) to 5 (completely true).<br/><em>Trust your first instinct. There is no right answer.</em></p>

      <figure class="figure">
        <img src="../images/g3/alignment.jpg" alt="" />
      </figure>

      <div class="alignment-questions" id="alignmentQuestions"></div>

      <div class="alignment-score-box">
        <span class="alignment-score-label">My alignment score</span>
        <span class="alignment-score-value"><span id="alignmentScore">0</span> <span class="alignment-score-max">/ 35</span></span>
      </div>
      <p class="muted">A score of 28 or more suggests the dream is well aligned with who you are becoming. A lower score is information, not a failure. You may want to adjust the dream, or notice which statements you scored low and ask why.</p>

      <div class="actions split">
        <button class="btn-secondary" data-action="prev"><span class="arrow">←</span> Back</button>

          <p>My Big Dream is to become a healthier business owner who leads through people and systems instead of personal rescue, so that my family, my health and my mentoring work all have space in my life. I want calm mornings, protected family evenings and a body and mind that can carry me into my fifties.</p>

      <div class="field-group">
        <label class="field-label" for="bigDream_one_sentence">My Big Dream, in one sentence: <span class="req">*</span></label>
        <textarea id="bigDream_one_sentence" class="textarea" data-key="bigDream_one_sentence" data-photo rows="3" placeholder="Short. Honest. Yours."></textarea>
      </div>

      <details class="examples">
        <summary>Show examples</summary>
        <div class="example">
          <strong>Pieter's example</strong>
          <p>I am becoming a present father, a healthier owner and a calm leader of my own life.</p>
        </div>
        <div class="example">
          <strong>Marietjie's example</strong>
          <p>I am becoming a woman with her own voice, a teacher, a writer and a present mother.</p>
        </div>
      </details>

      <h3 class="sub-title">Final Check</h3>
      <p>Read your one-sentence Big Dream. Then ask:</p>
      <ol class="final-check">
        <li>Does this feel chosen, not forced?</li>
        <li>Is it observable in my actual life?</li>
        <li>Does it connect to values that matter to me?</li>
        <li>Does it describe a person I want to become?</li>
        <li>Could I read this sentence in five years and still want to live it?</li>
      </ol>
      <p class="muted">If yes, take it into Guide 4.<br/>If not, return to the previous steps and keep softening the language until the sentence feels true.</p>
