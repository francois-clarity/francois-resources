<template id="tpl-welcome">

    <div class="hero">

    <div class="container narrow">

      <h1 class="display">Big Dream Guide 2: <span class="italic">Explore Possible Futures</span></h1>
      <p class="lede">Many people struggle to name what they want because they put too much pressure on the first answer.</p>

      <div class="callout">
        <h3 class="callout-title">THREE FUTURES</h3>
        <p>They think there must be one perfect dream, one correct path, one grand answer arriving with soft lighting and a soundtrack.</p>
        <p>That pressure shuts down imagination.</p>
        <p>This guide helps you sketch several possible futures before you choose one.</p>
        <p>The aim is not to decide immediately. The aim is to loosen the grip of <em>"I must get this right"</em> and create options that feel alive, meaningful and worth a closer look.</p>
        <p>A Big Dream often becomes clearer when you compare it with other possible futures.</p>
      </div>

      <div class="field-group">
        <label class="field-label" for="participant_name">Participant name <span class="req">*</span></label>
        <input type="text" id="participant_name" class="text-input" data-key="participant_name" autocomplete="name" placeholder="Your name" />

        <input type="email" id="participant_email" class="text-input" data-key="participant_email" autocomplete="email" placeholder="you@example.com" />
      </div>

      <div class="actions">
        <button class="btn-primary" data-action="next">Begin <span class="arrow">→</span></button>
      </div>
      <p class="tiny-note">Your answers are saved on your device as you go. You can leave and come back.</p>
    </div>

<template id="tpl-examples">
  <section class="screen">
    <div class="container narrow">
      <h2 class="section-title">Let's begin...</h2>

      <figure class="figure">
        <img src="../images/g2/characters.jpg" alt="" />
      </figure>

      <h3 class="sub-title">Optional Example Characters</h3>
      <p class="muted">Pieter and Marietjie are fictional example participants. Their examples are included only to help you if you feel stuck. You do not need to copy their style or answers. Use them only as a guide, then return to your own life and write what is true for you.</p>

      <div class="character-block">
        <h4>Pieter van der Merwe</h4>
        <p>Pieter is 46. He runs a small business. He is responsible, capable and tired. He has built a life that works on paper, but he feels like he is slowly becoming emotionally absent, reactive and stuck in survival mode.</p>
      </div>
      <div class="character-block">
        <h4>Marietjie Botha</h4>
        <p>Marietjie is 39. She is a teacher and mother of two. She loves her family, but she feels she has disappeared into everyone else's needs. She wants a future with more honesty, energy, creative expression and personal direction.</p>
      </div>

      <div class="character-block">
        <h4>From Guide 1</h4>
        <p>Pieter discovered his Big Dread: becoming a tired provider who loses his health, presence and joy while maintaining a life that looks successful from the outside.</p>
        <p>Marietjie discovered her Big Dread: becoming a useful, dependable person who slowly loses her own voice, creativity and sense of aliveness.</p>
      </div>

      <figure class="figure">
        <img src="../images/g2/method.jpg" alt="" />
      </figure>

      <h3 class="sub-title">The Method Behind This Guide</h3>
      <p>This guide uses three practical methods:</p>
      <ol class="method-list">
        <li>
          <strong>Life Design and Odyssey Planning</strong>
          <p>You sketch several possible futures instead of trying to force one perfect answer.</p>
        </li>
        <li>
          <strong>Best Possible Self writing</strong>
          <p>You imagine future versions of your life in concrete detail.</p>
        </li>
        <li>
          <strong>Values clarification</strong>
          <p>You look for the values and longings that repeat across the futures.</p>
        </li>
      </ol>
      <p class="instruction">Do not judge the futures too early.<br/>First sketch.<br/>Then compare.<br/><em>Then notice which future has energy.</em></p>

      <div class="actions split">
        <button class="btn-secondary" data-action="prev"><span class="arrow">←</span> Back</button>

      </div>
